name: Build Android Mod Menu .so

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # cho phép bấm build thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive  # kéo Dobby + ImGui submodule

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release .so
        run: |
          ./gradlew assembleRelease \
            -Pandroid.ndkVersion=26.3.11579264 \
            --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264

      - name: Collect .so files
        run: |
          mkdir -p output
          find . -name "*.so" \
            -path "*/arm64-v8a/*" \
            ! -path "*/build/intermediates/merged_native_libs/*" \
            -exec cp {} output/ \;
          echo "=== Found .so files ==="
          ls -la output/

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-menu-so-android15
          path: output/*.so
          retention-days: 30
