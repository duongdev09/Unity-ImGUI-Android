name: Build .so (NDK Direct)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Build .so via CMake + NDK
        run: |
          mkdir -p build
          $ANDROID_HOME/cmake/3.22.1/bin/cmake \
            -S . \
            -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.3.11579264/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

          $ANDROID_HOME/cmake/3.22.1/bin/cmake --build build --parallel

      - name: Collect .so
        run: |
          mkdir -p output
          find build -name "*.so" -exec cp {} output/ \;
          echo "=== Built files ==="
          ls -la output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modmenu-android15
          path: output/*.so
          retention-days: 30
