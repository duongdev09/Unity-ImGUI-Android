name: Build .so (NDK Direct)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix imgui — clone nếu rỗng
        run: |
          # Kiểm tra imgui có file không
          if [ ! -f "src/imgui/imgui.cpp" ]; then
            echo "imgui rỗng — đang clone về..."
            rm -rf src/imgui
            git clone --depth=1 https://github.com/ocornut/imgui.git src/imgui

            # Copy backend files cần thiết
            mkdir -p src/imgui/backends
            echo "imgui đã có:"
            ls src/imgui/
          else
            echo "imgui ok — bỏ qua"
          fi

          # Verify
          ls -la src/imgui/imgui.cpp
          ls -la src/imgui/backends/imgui_impl_android.cpp || echo "WARNING: backend thiếu"
          ls -la src/imgui/backends/imgui_impl_opengl3.cpp || echo "WARNING: backend thiếu"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26 + CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Build arm64-v8a
        run: |
          mkdir -p build/arm64
          $ANDROID_HOME/cmake/3.22.1/bin/cmake \
            -S src \
            -B build/arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.3.11579264/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

          $ANDROID_HOME/cmake/3.22.1/bin/cmake --build build/arm64 --parallel

      - name: Build armeabi-v7a
        run: |
          mkdir -p build/arm32
          $ANDROID_HOME/cmake/3.22.1/bin/cmake \
            -S src \
            -B build/arm32 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.3.11579264/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

          $ANDROID_HOME/cmake/3.22.1/bin/cmake --build build/arm32 --parallel

      - name: Collect .so files
        run: |
          mkdir -p output/arm64-v8a output/armeabi-v7a

          find build/arm64 -name "*.so" -exec cp {} output/arm64-v8a/ \;
          find build/arm32 -name "*.so" -exec cp {} output/armeabi-v7a/ \;

          cp $ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so \
             output/arm64-v8a/ || true
          cp $ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so \
             output/armeabi-v7a/ || true

          echo "=== arm64-v8a ==="
          ls -la output/arm64-v8a/
          echo "=== armeabi-v7a ==="
          ls -la output/armeabi-v7a/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modmenu-android15
          path: output/
          retention-days: 30
